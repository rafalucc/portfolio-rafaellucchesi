name: Capture V.O.A. Arena cover
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-voa-arena.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up 3D screenshot tools
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Capture Arena as a lightweight static WebP
        run: |
          cat > /tmp/capture-voa.cjs <<'JS'
          const { chromium } = require(process.cwd()+'/node_modules/playwright');
          const sharp = require(process.cwd()+'/node_modules/sharp');
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(),'arte/projetos/premio-decio-noviello/3d');
          const types={'.html':'text/html','.js':'application/javascript','.jpg':'image/jpeg','.png':'image/png'};
          const server=http.createServer((req,res)=>{
            const relative=decodeURIComponent(new URL(req.url,'http://localhost').pathname).replace(/^\\/+/, '')||'index.html';
            const filepath=path.resolve(root,relative);
            if(!filepath.startsWith(root+path.sep)&&filepath!==path.join(root,'index.html')){res.writeHead(403);return res.end();}
            fs.readFile(filepath,(err,data)=>{if(err){res.writeHead(404);return res.end();}res.writeHead(200,{'Content-Type':types[path.extname(filepath)]||'application/octet-stream'});res.end(data);});
          });
          (async()=>{
            await new Promise(resolve=>server.listen(8765,'127.0.0.1',resolve));
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:810},deviceScaleFactor:1});
              page.on('pageerror',e=>console.log('browser error:',e.message));
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded'});
              await page.locator('#views button').filter({hasText:'Arena'}).click({timeout:45000});
              await page.waitForTimeout(3200);
              const canvas=page.locator('#app canvas');
              if(await canvas.count()!==1) throw Error('The 3D canvas did not load');
              const buf=await canvas.screenshot({timeout:30000});
              const output=path.join(process.cwd(),'assets/images/arte/projetos/premio-decio-noviello-arena.webp');
              fs.mkdirSync(path.dirname(output),{recursive:true});
              await sharp(buf).resize(1280,720,{fit:'cover'}).webp({quality:80,effort:4}).toFile(output);
              console.log('Saved Arena cover:',output,fs.statSync(output).size,'bytes');
            }finally{await browser.close();server.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/capture-voa.cjs
      - name: Publish card image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/arte/projetos/premio-decio-noviello-arena.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: capture Arena 3D as optimized static card image"
            git push origin HEAD:main
          fi
